version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: careerai-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careerai-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://localhost:3000
      MONGO_URI: mongodb://mongo:27017/careerai
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production}
      JWT_EXPIRE: 7d
      JWT_COOKIE_EXPIRE: 7
      BCRYPT_SALT_ROUNDS: 10
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM_NAME: CareerAI
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-notifications@careerai.com}
    volumes:
      - backend-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', r => process.exit(r.statusCode===200?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
    container_name: careerai-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '3000:3000'
    # NOTE: NEXT_PUBLIC_* vars are compiled into the JS bundle at BUILD time
    # (see build.args above), not read at container runtime. This block is
    # documentation of what was baked in, not a live override — to change
    # the API URL you must rebuild the image with a different build arg.
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api

volumes:
  mongo-data:
  backend-uploads:
